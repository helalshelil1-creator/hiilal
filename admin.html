<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>لوحة التحكم | Eng. Helal Shalil</title>
<script src="js/seo-data.js"></script>
<script src="js/seo.js"></script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/cloud.js"></script>

<link rel="icon" type="image/png" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<style>
body { background: #050d1a; color: #f1f5f9; padding-bottom: 0; }

#adminGate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 30px 20px;
    background: radial-gradient(ellipse at 50% 0%, rgba(0,217,255,.15), transparent 60%), linear-gradient(135deg, #050d1a 0%, #0a1628 50%, #12263f 100%); }
.gate-box { max-width: 440px; width: 100%; padding: 40px 32px; background: rgba(255,255,255,.04); backdrop-filter: blur(20px); border-radius: 26px; border: 1px solid rgba(0,217,255,.2); box-shadow: 0 30px 80px rgba(0,0,0,.5); }
.gate-logo { text-align: center; margin-bottom: 20px; }
.gate-logo-img { width: 100px; height: 100px; border-radius: 24px; object-fit: cover; margin: 0 auto; box-shadow: 0 20px 50px rgba(0,217,255,.4); border: 2px solid rgba(0,217,255,.4); display: block; background: linear-gradient(135deg, #00d9ff, #22d3ee); }
.gate-box h1 { color: #fff; font-size: 24px; font-weight: 900; margin: 15px 0 8px; text-align: center; }
.gate-box > p { color: #94a3b8; font-size: 13px; margin-bottom: 25px; text-align: center; }
.gate-form .form-group { margin-bottom: 16px; }
.gate-form label { display: block; font-size: 13px; font-weight: 700; color: #cbd5e1; margin-bottom: 6px; }
.gate-form input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1.5px solid rgba(0,217,255,.2); background: rgba(0,0,0,.3); color: #fff; font-family: inherit; font-size: 15px; outline: none; text-align: center; letter-spacing: 4px; }
.gate-form input:focus { border-color: #00d9ff; box-shadow: 0 0 0 4px rgba(0,217,255,.15); }
.btn-gate { width: 100%; padding: 15px; border-radius: 14px; border: none; background: linear-gradient(135deg, #00d9ff, #22d3ee); color: #0a1628; font-family: inherit; font-weight: 800; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 12px 30px rgba(0,217,255,.4); }
.btn-gate:hover { transform: translateY(-3px); box-shadow: 0 18px 40px rgba(0,217,255,.5); }
.gate-footer { text-align: center; margin-top: 22px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.08); }
.gate-footer a { color: #67e8f9; font-weight: 700; font-size: 13px; }

.admin-header { background: linear-gradient(135deg, #0a1628, #12263f); border-bottom: 1px solid rgba(0,217,255,.2); padding: 16px 5%; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 30px rgba(0,0,0,.4); }
.admin-header-inner { max-width: 1500px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; }
.admin-brand { display: flex; align-items: center; gap: 14px; }
.admin-logo { width: 48px; height: 48px; border-radius: 13px; object-fit: cover; box-shadow: 0 6px 20px rgba(0,217,255,.4); border: 1.5px solid rgba(0,217,255,.4); background: linear-gradient(135deg, #00d9ff, #22d3ee); }
.admin-brand-text h1 { color: #fff; font-size: 17px; font-weight: 900; line-height: 1.3; }
.admin-brand-text h1 span { color: #67e8f9; }
.admin-brand-text small { color: #94a3b8; font-size: 10px; font-weight: 600; font-family: 'JetBrains Mono', monospace; display: block; margin-top: 2px; }
.admin-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.action-btn { width: 40px; height: 40px; border-radius: 11px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.action-btn:hover { background: linear-gradient(135deg, #00d9ff, #22d3ee); color: #0a1628; border-color: transparent; }
.admin-btn { padding: 10px 18px; border-radius: 12px; border: none; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 7px; }
.admin-btn-primary { background: linear-gradient(135deg, #00d9ff, #22d3ee); color: #0a1628; box-shadow: 0 8px 22px rgba(0,217,255,.35); }
.admin-btn-secondary { background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.15); }
.admin-btn-danger { background: rgba(225,29,72,.2); color: #fecdd3; border: 1px solid rgba(225,29,72,.4); }

.admin-main { max-width: 1500px; margin: 0 auto; padding: 25px 5%; }
.admin-section { margin-bottom: 25px; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.stat-card { padding: 20px; background: linear-gradient(135deg, #0a1628 0%, #12263f 100%); border: 1px solid #1e3450; border-radius: 18px; text-align: center; cursor: pointer; }
.stat-card:hover { transform: translateY(-5px); border-color: #00d9ff; box-shadow: 0 20px 40px -10px rgba(0,217,255,.3); }
.stat-ico { width: 48px; height: 48px; border-radius: 13px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; color: #fff; font-size: 22px; }
.stat-num { font-size: 28px; font-weight: 900; color: #67e8f9; font-family: 'JetBrains Mono', monospace; line-height: 1; margin-bottom: 6px; }
.stat-lbl { font-size: 12px; color: #94a3b8; font-weight: 700; }

.tabs-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; padding-bottom: 5px; border-bottom: 1px solid #1e3450; }
.tab-btn { padding: 10px 18px; border-radius: 999px; border: 1px solid #1e3450; background: #0a1628; color: #cbd5e1; font-family: inherit; font-weight: 700; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.tab-btn.active, .tab-btn:hover { background: linear-gradient(135deg, #00d9ff, #22d3ee); color: #0a1628; border-color: transparent; box-shadow: 0 6px 18px rgba(0,217,255,.35); }

.panel { background: #0a1628; border: 1px solid #1e3450; border-radius: 20px; padding: 24px; margin-bottom: 20px; }
.panel h3 { color: #67e8f9; font-size: 16px; font-weight: 800; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid #1e3450; display: flex; align-items: center; gap: 10px; }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
@media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 700; color: #cbd5e1; margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid #1e3450; background: #050d1a; color: #fff; font-family: inherit; font-size: 13px; outline: none; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #00d9ff; box-shadow: 0 0 0 4px rgba(0,217,255,.15); }
.form-group textarea { resize: vertical; min-height: 90px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }

.btn-save { display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 12px; border: none; background: linear-gradient(135deg, #00d9ff, #22d3ee); color: #0a1628; font-family: inherit; font-weight: 800; font-size: 13px; cursor: pointer; }
.btn-save:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,217,255,.5); }
.btn-save:disabled { opacity: .5; cursor: not-allowed; }

.items-list { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.item-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; background: #050d1a; border: 1px solid #1e3450; border-radius: 14px; }
.item-row:hover { border-color: #00d9ff; background: rgba(0,217,255,.05); }
.item-row-info { flex: 1; min-width: 0; }
.item-row-info h4 { color: #67e8f9; font-size: 13.5px; font-weight: 800; margin-bottom: 3px; }
.item-row-info p { color: #94a3b8; font-size: 11.5px; line-height: 1.5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-row-info small { color: #00d9ff; font-size: 10px; font-weight: 700; display: block; margin-top: 3px; }
.item-actions { display: flex; gap: 6px; flex-shrink: 0; }
.icon-action { width: 34px; height: 34px; border-radius: 10px; border: 1px solid #1e3450; background: #0a1628; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; }
.icon-action:hover { background: linear-gradient(135deg, #00d9ff, #22d3ee); color: #0a1628; border-color: transparent; }
.icon-action.danger { color: #e11d48; }
.icon-action.danger:hover { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }

.empty-state { text-align: center; padding: 50px 20px; color: #64748b; }
.empty-state .ico { width: 70px; height: 70px; border-radius: 20px; background: #050d1a; border: 2px dashed #1e3450; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 15px; font-size: 30px; }
.empty-state h4 { color: #cbd5e1; font-size: 15px; font-weight: 700; margin-bottom: 6px; }

.welcome-banner { background: linear-gradient(135deg, rgba(0,217,255,.15), rgba(0,217,255,.03)); border: 1px solid rgba(0,217,255,.3); border-radius: 18px; padding: 24px; text-align: center; }
.welcome-banner h2 { color: #fff; font-size: 22px; font-weight: 900; margin-bottom: 10px; }
.welcome-banner p { color: #cbd5e1; font-size: 13px; margin-bottom: 18px; }
.quick-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.quick-btn { padding: 12px 20px; border-radius: 12px; border: 1px solid rgba(0,217,255,.3); background: rgba(0,217,255,.1); color: #67e8f9; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; }
.quick-btn:hover { background: linear-gradient(135deg, #00d9ff, #22d3ee); color: #0a1628; }

.cloud-status { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-size: 11px; font-weight: 700; }
.cloud-status.online { background: rgba(34,197,94,.15); color: #22c55e; border: 1px solid rgba(34,197,94,.3); }
.cloud-status.offline { background: rgba(239,68,68,.15); color: #ef4444; border: 1px solid rgba(239,68,68,.3); }
.cloud-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulseDot 1.5s ease-in-out infinite; }
@keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

#adminToast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); padding: 14px 24px; background: linear-gradient(135deg, #00d9ff, #22d3ee); color: #0a1628; border-radius: 14px; font-weight: 800; font-size: 13px; z-index: 9999; transition: all .4s cubic-bezier(.16,1,.3,1); box-shadow: 0 15px 40px rgba(0,217,255,.4); max-width: 90%; text-align: center; }
#adminToast.show { transform: translateX(-50%) translateY(0); }
#adminToast.error { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
#adminToast.success { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; }
#adminToast.info { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; }

@media (max-width: 700px) {
    .admin-header { padding: 12px 4%; }
    .admin-main { padding: 18px 4%; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat-card { padding: 14px; }
    .stat-num { font-size: 22px; }
    .gate-box { padding: 30px 24px; }
    .admin-btn span { display: none; }
    .tab-btn { font-size: 11px; padding: 8px 14px; }
}
</style>
</head>
<body>

<!-- ==================== GATE ==================== -->
<div id="adminGate">
    <div class="gate-box">
        <div class="gate-logo">
            <img src="images/logo.png" alt="Eng. Helal Shalil" class="gate-logo-img" onerror="this.style.display='none'">
        </div>
        <h1>لوحة التحكم</h1>
        <p>هذه الصفحة مخصصة للمهندس فقط</p>

        <form onsubmit="unlockAdmin(event)" class="gate-form">
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="adminPass" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-gate">
                🔓 دخول
            </button>
        </form>

        <div class="gate-footer">
            <a href="index.html">← العودة للمنصة</a>
        </div>
    </div>
</div>

<!-- ==================== MAIN PANEL ==================== -->
<div id="adminPanel" style="display:none;">

    <header class="admin-header">
        <div class="admin-header-inner">
            <div class="admin-brand">
                <img src="images/logo.png" alt="Logo" class="admin-logo" onerror="this.style.display='none'">
                <div class="admin-brand-text">
                    <h1>لوحة تحكم <span>المكتب</span></h1>
                    <small>Eng. Helal Shalil — Cloud Sync</small>
                </div>
            </div>
            <div class="admin-actions">
                <span id="cloudStatus" class="cloud-status offline">
                    <span class="cloud-dot"></span>
                    <span>جاري الاتصال...</span>
                </span>
                <a href="index.html" class="admin-btn admin-btn-secondary">
                    <span>المنصة</span>
                </a>
                <button class="admin-btn admin-btn-danger" onclick="lockAdmin()">
                    <span>خروج</span>
                </button>
            </div>
        </div>
    </header>

    <main class="admin-main">
        <section class="admin-section">
            <div class="stats-grid" id="statsGrid"></div>
        </section>

        <section class="admin-section">
            <div class="tabs-bar" id="tabsBar">
                <button class="tab-btn active" data-tab="dashboard">🏠 الرئيسية</button>
                <button class="tab-btn" data-tab="content">📚 المحتوى</button>
                <button class="tab-btn" data-tab="codes">📘 الأكواد</button>
                <button class="tab-btn" data-tab="specs">📋 المواصفات</button>
                <button class="tab-btn" data-tab="products">📦 المنتجات</button>
                <button class="tab-btn" data-tab="projects">🏗️ المشاريع</button>
                <button class="tab-btn" data-tab="software">🖥️ أدلة البرامج</button>
                <button class="tab-btn" data-tab="backup">💾 نسخ احتياطي</button>
            </div>

            <div id="tabContent"></div>
        </section>
    </main>
</div>

<div id="adminToast"></div>

<!-- ==================== SCRIPTS ==================== -->
<script src="js/storage.js"></script>
<script src="js/icons.js"></script>

<script>
(function() {
    'use strict';

    const ADMIN_UNLOCK_KEY = "engAdminUnlocked";
    let currentTab = "dashboard";
    let cloudData = {};  // كاش للبيانات من Cloud

    /* ========================================
       TOAST
    ======================================== */
    function adminToast(msg, type = "success") {
        const el = document.getElementById("adminToast");
        if (!el) return;
        el.textContent = msg;
        el.className = type;
        el.classList.add("show");
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.remove("show"), 2800);
    }
    window.adminToast = adminToast;

    /* ========================================
       AUTH
    ======================================== */
    window.unlockAdmin = function(e) {
        e.preventDefault();
        const p = document.getElementById("adminPass").value;
        if (p === window.ADMIN_PASSWORD) {
            sessionStorage.setItem(ADMIN_UNLOCK_KEY, "1");
            showPanel();
            adminToast("🔓 مرحبًا بك يا هندسة", "success");
        } else {
            adminToast("❌ كلمة المرور غلط", "error");
            document.getElementById("adminPass").value = "";
        }
    };

    window.lockAdmin = function() {
        sessionStorage.removeItem(ADMIN_UNLOCK_KEY);
        location.reload();
    };

    async function showPanel() {
        const gate = document.getElementById("adminGate");
        const panel = document.getElementById("adminPanel");
        if (gate) gate.style.display = "none";
        if (panel) panel.style.display = "block";

        // Init Cloud
        const ok = await Cloud.init();
        updateCloudStatus(ok);

        if (ok) {
            // تحميل البيانات من Cloud
            await loadAllCloudData();
        }

        renderStats();
        renderTab("dashboard");
    }

    function updateCloudStatus(isOnline) {
        const el = document.getElementById("cloudStatus");
        if (!el) return;
        if (isOnline) {
            el.className = "cloud-status online";
            el.innerHTML = '<span class="cloud-dot"></span><span>متصل بـ Cloud ☁️</span>';
        } else {
            el.className = "cloud-status offline";
            el.innerHTML = '<span class="cloud-dot"></span><span>غير متصل</span>';
        }
    }

    /* ========================================
       LOAD ALL DATA FROM CLOUD
    ======================================== */
    async function loadAllCloudData() {
        const collections = [
            "content", "codes", "specs", "products", "projects",
            "software_autocad", "software_revit", "software_hotkeys",
            "youtube_videos", "software_guide_links"
        ];
        for (const col of collections) {
            cloudData[col] = await Cloud.getAll(col);
        }
        console.log("✅ Cloud data loaded:", cloudData);
    }

    async function refreshCollection(name) {
        cloudData[name] = await Cloud.getAll(name);
        return cloudData[name];
    }

    /* ========================================
       STATS
    ======================================== */
    function renderStats() {
        const grid = document.getElementById("statsGrid");
        if (!grid) return;

        const data = {
            content: cloudData.content?.length || 0,
            codes: cloudData.codes?.length || 0,
            specs: cloudData.specs?.length || 0,
            products: cloudData.products?.length || 0,
            projects: cloudData.projects?.length || 0,
            software: (cloudData.software_autocad?.length || 0) +
                      (cloudData.software_revit?.length || 0) +
                      (cloudData.software_hotkeys?.length || 0),
            videos: cloudData.youtube_videos?.length || 0,
            favorites: (window.Store ? Store.getFavorites().length : 0)
        };

        const cards = [
            { ico: "📚", num: data.content, lbl: "المحتوى", tab: "content", color: "#00d9ff" },
            { ico: "📘", num: data.codes, lbl: "الأكواد", tab: "codes", color: "#22c55e" },
            { ico: "📋", num: data.specs, lbl: "المواصفات", tab: "specs", color: "#f59e0b" },
            { ico: "📦", num: data.products, lbl: "المنتجات", tab: "products", color: "#ec4899" },
            { ico: "🏗️", num: data.projects, lbl: "المشاريع", tab: "projects", color: "#8b5cf6" },
            { ico: "🖥️", num: data.software, lbl: "أقسام برامج", tab: "software", color: "#06b6d4" },
            { ico: "🎥", num: data.videos, lbl: "فيديوهات", tab: "software", color: "#ef4444" },
            { ico: "❤️", num: data.favorites, lbl: "المفضلة", tab: "dashboard", color: "#f97316" }
        ];

        grid.innerHTML = cards.map(c => `
            <div class="stat-card" data-tab="${c.tab}">
                <div class="stat-ico" style="background:linear-gradient(135deg, ${c.color}, ${c.color}dd);">${c.ico}</div>
                <div class="stat-num">${c.num}</div>
                <div class="stat-lbl">${c.lbl}</div>
            </div>
        `).join("");

        grid.querySelectorAll(".stat-card").forEach(card => {
            card.addEventListener("click", () => switchTab(card.dataset.tab));
        });
    }

    /* ========================================
       TABS
    ======================================== */
    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.classList.toggle("active", btn.dataset.tab === tab);
        });
        renderTab(tab);
    }
    window.switchTab = switchTab;

    function renderTab(tab) {
        const el = document.getElementById("tabContent");
        if (!el) return;

        switch (tab) {
            case "dashboard": el.innerHTML = renderDashboard(); break;
            case "content":   el.innerHTML = renderContent(); break;
            case "codes":     el.innerHTML = renderCodes(); break;
            case "specs":     el.innerHTML = renderSpecs(); break;
            case "products":  el.innerHTML = renderProducts(); break;
            case "projects":  el.innerHTML = renderProjects(); break;
            case "software":  el.innerHTML = renderSoftware(); break;
            case "backup":    el.innerHTML = renderBackup(); break;
            default:          el.innerHTML = renderDashboard();
        }
    }

    /* ========================================
       DASHBOARD
    ======================================== */
    function renderDashboard() {
        return `
            <div class="panel">
                <h3>📊 نظرة سريعة</h3>
                <div class="welcome-banner">
                    <h2>أهلاً بك يا هندسة 👋</h2>
                    <p>مركز التحكم الكامل بموقعك — كل إضافة تظهر فوراً على كل الأجهزة ☁️</p>
                    <div class="quick-actions">
                        <button onclick="switchTab('content')" class="quick-btn">📚 إضافة محتوى</button>
                        <button onclick="switchTab('software')" class="quick-btn">🖥️ أدلة البرامج</button>
                        <button onclick="switchTab('projects')" class="quick-btn">🏗️ مشروع جديد</button>
                        <button onclick="switchTab('backup')" class="quick-btn">💾 نسخة احتياطية</button>
                    </div>
                </div>
            </div>
        `;
    }

    /* ========================================
       CONTENT
    ======================================== */
    function renderContent() {
        const items = cloudData.content || [];
        return `
            <div class="panel">
                <h3>➕ إضافة محتوى جديد</h3>
                <form onsubmit="saveContent(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label>النوع *</label>
                            <select id="ci_type" required>

    window.saveSoftwareSection = async function(e) {
        e.preventDefault();
        const type = document.getElementById("sw_type").value;
        const icon = document.getElementById("sw_icon").value.trim() || "⭐";
        const title = document.getElementById("sw_title").value.trim();
        const commandsRaw = document.getElementById("sw_commands").value.trim();

        if (!title || !commandsRaw) return;

        const commands = commandsRaw.split("\n").map(line => line.trim()).filter(Boolean).map(line => {
            const parts = line.split("|");
            return { key: (parts[0] || "").trim(), name: (parts.slice(1).join("|") || parts[0] || "").trim() };
        }).filter(c => c.key);

        if (commands.length === 0) { adminToast("⚠️ لا توجد أوامر", "error"); return; }

        try {
            await Cloud.add("software_" + type, { icon, title, commands });
            await refreshCollection("software_" + type);
            e.target.reset();
            document.getElementById("sw_icon").value = "⭐";
            adminToast(`✅ تم حفظ ${commands.length} أمر`, "success");
            renderTab("software");
            renderStats();

            adminToast("❌ فشل: " + err.message, "error");

            <div class="panel">
                <h3>🔄 نقل البيانات القديمة (localStorage → Cloud)</h3>
                <p style="color:#94a3b8;font-size:13px;line-height:1.8;margin-bottom:16px;">إذا كان عندك بيانات قديمة محفوظة محلياً على هذا الجهاز، يمكنك نقلها إلى Cloud لتظهر على كل الأجهزة.</p>
                <button onclick="migrateNow()" class="admin-btn admin-btn-primary">🔄 بدء النقل</button>
            </div>
            <div class="panel" style="border-color:rgba(225,29,72,.4);background:rgba(225,29,72,.05);">
                <h3 style="color:#fecdd3;">⚠️ إعادة ضبط شاملة</h3>
                <p style="color:#94a3b8;font-size:12.5px;line-height:1.8;margin-bottom:16px;">سيتم حذف كل البيانات من Cloud. لا يمكن التراجع.</p>
                <button onclick="resetAll()" class="admin-btn admin-btn-danger">🗑️ حذف كل البيانات</button>
            </div>
        `;
    }

    window.quickExport = async function() {
        const data = {
            exportDate: new Date().toISOString(),
            siteName: "Eng. Helal Shalil Office",
            version: "3.0",
            cloud: {}
        };
        for (const col in cloudData) {
            data.cloud[col] = cloudData[col];
        }
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "cloud-backup-" + Date.now() + ".json";
        a.click();
        URL.revokeObjectURL(url);
        adminToast("📥 تم تصدير النسخة", "success");
    };

    window.migrateNow = async function() {
        if (!confirm("سيتم نقل البيانات المحلية إلى Cloud. متابعة؟")) return;
        adminToast("⏳ جاري النقل...", "info");
        try {
            await Cloud.migrateLocalToCloud();
            await loadAllCloudData();
            adminToast("✅ تم نقل كل البيانات", "success");
            renderStats();
            renderTab(currentTab);
        } catch (err) {
            adminToast("❌ فشل النقل: " + err.message, "error");
        }
    };

    window.resetAll = async function() {
        if (!confirm("⚠️ هل أنت متأكد؟ سيتم حذف كل البيانات من Cloud.")) return;
        if (!confirm("⚠️ تأكيد أخير!")) return;

        const collections = [
            "content", "codes", "specs", "products", "projects",
            "software_autocad", "software_revit", "software_hotkeys",
            "youtube_videos", "software_guide_links"
        ];

        for (const col of collections) {
            const items = cloudData[col] || [];
            for (const item of items) {
                try { await Cloud.remove(col, item.id); } catch (e) {}
            }
        }
        await loadAllCloudData();
        adminToast("🗑️ تم حذف كل البيانات", "info");
        renderStats();
        renderTab(currentTab);
    };

    /* ========================================
       DELETE
    ======================================== */
    window.deleteItem = async function(collection, id) {
        if (!confirm("حذف هذا العنصر؟")) return;
        try {
            await Cloud.remove(collection, id);
            await refreshCollection(collection);
            adminToast("🗑️ تم الحذف من كل الأجهزة", "info");
            renderTab(currentTab);
            renderStats();
        } catch (err) {
            adminToast("❌ فشل الحذف: " + err.message, "error");
        }
    };

    /* ========================================
       HELPERS
    ======================================== */
    function escapeHtml(s) {
        if (s == null) return "";
        const d = document.createElement("div");
        d.textContent = String(s);
        return d.innerHTML;
    }
    window.escapeHtml = escapeHtml;

    function emptyState(msg) {
        return `<div class="empty-state"><div class="ico">📁</div><h4>${msg}</h4></div>`;
    }

    /* ========================================
       INIT
    ======================================== */
    document.addEventListener("DOMContentLoaded", function() {
        if (sessionStorage.getItem(ADMIN_UNLOCK_KEY) === "1") {
            showPanel();
        }

        document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.addEventListener("click", function() {
                switchTab(this.dataset.tab);
            });
        });

        const hash = (location.hash || "").replace("#", "");
        if (hash && ["dashboard", "content", "codes", "specs", "products", "projects", "software", "backup"].includes(hash)) {
            setTimeout(() => {
                if (sessionStorage.getItem(ADMIN_UNLOCK_KEY) === "1") switchTab(hash);
                else window._pendingTab = hash;
            }, 100);
        }
    });

    const _origShow = showPanel;
    showPanel = async function() {
        await _origShow();
        if (window._pendingTab) {
            switchTab(window._pendingTab);
            window._pendingTab = null;
        }
    };
})();
</script>

</body>
</html>
