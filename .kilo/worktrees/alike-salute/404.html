<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصفحة غير موجودة (404) | مكتب المهندس هلال شليل</title>
<!-- SEO Auto Injection -->
<script src="js/seo-data.js"></script>
<script src="js/seo.js"></script>
<meta name="robots" content="noindex, follow">
<meta name="description" content="الصفحة المطلوبة غير موجودة. يمكنك العودة إلى الصفحة الرئيسية لمكتب المهندس هلال شليل.">
<link rel="icon" type="image/png" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
<style>
body {
    background: linear-gradient(135deg, #050d1a 0%, #0a1628 50%, #12263f 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    margin: 0;
}
.err-box {
    text-align: center;
    max-width: 500px;
    background: rgba(255,255,255,.04);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(0,217,255,.2);
    border-radius: 30px;
    padding: 50px 35px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
}
.err-code {
    font-size: 120px;
    font-weight: 900;
    background: linear-gradient(135deg, #00d9ff, #22d3ee, #7c3aed);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1;
    margin-bottom: 10px;
    font-family: 'JetBrains Mono', monospace;
}
.err-box h1 {
    color: #fff;
    font-size: 24px;
    font-weight: 900;
    margin-bottom: 12px;
}
.err-box p {
    color: #94a3b8;
    font-size: 14px;
    line-height: 1.8;
    margin-bottom: 25px;
}
.err-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 28px;
    background: linear-gradient(135deg, #00d9ff, #22d3ee);
    color: #0a1628;
    border-radius: 14px;
    font-weight: 800;
    font-size: 14px;
    text-decoration: none;
    box-shadow: 0 12px 30px rgba(0,217,255,.4);
    transition: all .3s;
}
.err-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 18px 40px rgba(0,217,255,.5);
}
.err-logo {
    width: 80px;
    height: 80px;
    margin: 0 auto 20px;
    border-radius: 20px;
    border: 2px solid rgba(0,217,255,.4);
    object-fit: cover;
    background: linear-gradient(135deg, #00d9ff, #22d3ee);
}
</style>
</head>
<body>

<div class="err-box">
    <img src="images/logo.png" alt="Eng. Helal Shalil" class="err-logo" onerror="this.style.display='none'">
    <div class="err-code">404</div>
    <h1>الصفحة غير موجودة</h1>
    <p>الصفحة اللي بتدور عليها مش موجودة أو اتنقلت لمكان تاني.</p>
    <a href="index.html" class="err-btn">
        ← العودة للرئيسية
    </a>
</div>

</body>
</html>
